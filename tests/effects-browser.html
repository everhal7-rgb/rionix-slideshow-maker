<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>演出の描画テスト</title><style>body{background:#10172b;color:white;font:16px system-ui;max-width:720px;margin:32px auto;padding:16px}canvas{width:100%;background:black}button{padding:16px;margin:16px 0}pre{white-space:pre-wrap}</style><h1>v0.2 演出の描画テスト</h1><p>実際のCanvasでピクセルを検査します。MP4エンコードのテストではありません。</p><pre id="report">検査中</pre><canvas id="test" width="320" height="180"></canvas><button id="play">15秒の演出デモ</button><p id="time"></p><script type="module">
import {drawFrame,releaseDrawBuffers} from '../src/timeline.js';
const canvas=document.getElementById('test'),report=document.getElementById('report'),lines=[];
function make(color,w=160,h=90){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle=color;x.fillRect(0,0,w,h);return c;}
function pixel(x,y){return [...canvas.getContext('2d').getImageData(x,y,1,1).data].slice(0,3);}
function expect(name,actual,wanted){if(actual.some((v,i)=>Math.abs(v-wanted[i])>2))throw new Error(name+': '+actual+' expected '+wanted);lines.push('PASS '+name);}
try{
 const clips=[{bitmap:make('#ff0000'),seconds:5,motion:'none'},{bitmap:make('#0000ff'),seconds:5,motion:'none'},{bitmap:make('#00ff00'),seconds:5,motion:'none'}];
 drawFrame(canvas,clips,4,.8);expect('フェード前',pixel(160,90),[255,0,0]);
 drawFrame(canvas,clips,4.6,.8);expect('50%で赤と青が混ざる',pixel(160,90),[128,0,128]);
 drawFrame(canvas,clips,5,.8);expect('5秒で次画像へ',pixel(160,90),[0,0,255]);
 drawFrame(canvas,clips,4.9,0);expect('カットは混ざらない',pixel(160,90),[255,0,0]);
 clips[1].bitmap=make('#0000ff',50,90);
 drawFrame(canvas,clips,4.6,.8);expect('縦画像の黒余白も正しくフェード',pixel(2,90),[128,0,0]);
 drawFrame(canvas,clips,5,.8);expect('縦画像の黒余白',pixel(2,90),[0,0,0]);
 const striped=make('#ff0000');striped.getContext('2d').fillStyle='white';striped.getContext('2d').fillRect(0,0,2,90);
 const zoom=[{bitmap:striped,seconds:5,motion:'in'}];
 drawFrame(canvas,zoom,0);expect('ズーム開始時の端',pixel(1,90),[255,255,255]);
 drawFrame(canvas,zoom,5);expect('ズーム後は端をクロップ',pixel(1,90),[255,0,0]);
 zoom[0].motion='out';drawFrame(canvas,zoom,5);expect('引き終わりは全体表示',pixel(1,90),[255,255,255]);
 releaseDrawBuffers(canvas);report.textContent=`${lines.length}件成功\n`+lines.join('\n');
 const demo=clips.map((c,i)=>({...c,motion:i===1?'out':'in'}));
 document.getElementById('play').onclick=()=>{const button=document.getElementById('play');button.disabled=true;const start=performance.now();const tick=()=>{const t=Math.min(15,(performance.now()-start)/1000);drawFrame(canvas,demo,t,.8);document.getElementById('time').textContent=t.toFixed(1)+' / 15秒';if(t<15)requestAnimationFrame(tick);else{button.disabled=false;releaseDrawBuffers(canvas);}};tick();};
}catch(e){report.textContent='FAIL '+e.message;throw e;}
</script></html>
