<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>字幕描画・復元テスト</title><style>body{font:16px system-ui;background:#0c1020;color:white;max-width:760px;margin:24px auto;padding:16px}canvas{width:100%;aspect-ratio:16/9}button{padding:16px;margin:8px}pre{white-space:pre-wrap}</style><h1>v0.7 字幕描画・復元テスト</h1><p>専用のテスト保存領域を使用します。普段の編集データは変更しません。</p><button id="test">字幕を保存して復元</button><button id="next">2枚目の字幕を表示</button><canvas id="canvas" width="1280" height="720"></canvas><pre id="report">未実行</pre><script type="module">
import {drawFrame} from '../src/timeline.js';
import {makeProject,projectStore,restoreProject} from '../src/project.js';
import {disposeImages} from '../src/assets.js';
let clips=[];const canvas=document.getElementById('canvas'),report=document.getElementById('report');
document.getElementById('test').onclick=async()=>{try{
 const source=document.createElement('canvas');source.width=1280;source.height=720;const c=source.getContext('2d');const g=c.createLinearGradient(0,0,1280,720);g.addColorStop(0,'#23336b');g.addColorStop(1,'#bd8aa9');c.fillStyle=g;c.fillRect(0,0,1280,720);c.fillStyle='#f6e1bb';c.beginPath();c.arc(900,200,110,0,Math.PI*2);c.fill();
 const file=new File([await new Promise(r=>source.toBlob(r))],'sample.png',{type:'image/png'});
 const captions=['はるとつくる、小さな映像。\nRIONIX PROJECT','長い日本語の字幕も、画面の幅に合わせて折り返して表示します。画像が寄っても引いても文字は固定されます。'];
 await projectStore('save',makeProject(captions.map(caption=>({file,name:file.name,seconds:30,motion:'in',caption})),null,{resolution:'720',transition:'0.8',audioStart:0}),'rionix-caption-test');
 const p=await projectStore('load',null,'rionix-caption-test');const restored=await restoreProject(p);disposeImages(clips);clips=restored.clips;
 if(clips.some((clip,i)=>clip.caption!==captions[i]))throw new Error('字幕復元不一致');
 drawFrame(canvas,clips,29.6,.8);report.textContent='PASS 字幕2件の保存・素材復元。29.6秒：フェード中も1枚目の字幕。';
 }catch(e){report.textContent='FAIL '+e.message;}};
document.getElementById('next').onclick=()=>{if(!clips.length)return;drawFrame(canvas,clips,30,.8);report.textContent='30秒：2枚目へ切り替え。長い日本語の折り返しを確認してください。';};
</script></html>
