<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>編集保存の実ブラウザーテスト</title><style>body{font:16px system-ui;background:#10172b;color:white;max-width:700px;margin:32px auto;padding:16px}button{padding:16px;margin:12px}pre{white-space:pre-wrap}</style><h1>編集保存テスト</h1><p>専用テスト領域を使います。アプリの保存内容は変更しません。保存後にページを再読み込みして検証してください。</p><button id="save">テストデータ保存</button><button id="verify">保存内容を検証</button><pre id="report">未実行</pre><script type="module">
import {makeProject,restoreProject,projectStore} from '../src/project.js';
import {disposeImages,disposeAudio} from '../src/assets.js';
const report=document.getElementById('report'),db='rionix-project-test-v1';
function wav(){const n=8000,b=new ArrayBuffer(44+n*2),v=new DataView(b);const str=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));str(0,'RIFF');v.setUint32(4,36+n*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,n*2,true);return new File([b],'test.wav',{type:'audio/wav'});}
document.getElementById('save').onclick=async()=>{try{const c=document.createElement('canvas');c.width=32;c.height=18;c.getContext('2d').fillRect(0,0,32,18);const blob=await new Promise(r=>c.toBlob(r));const file=new File([blob],'test.png',{type:'image/png'});await projectStore('save',makeProject([{file,name:file.name,seconds:15,motion:'out'}],{file:wav(),name:'test.wav'},{resolution:'1080',transition:'0.4',audioStart:.5}),db);report.textContent='保存成功。ページを再読み込みして「保存内容を検証」を押してください。';}catch(e){report.textContent='FAIL '+e.message;}};
document.getElementById('verify').onclick=async()=>{let restored;try{const p=await projectStore('load',null,db);restored=await restoreProject(p);if(restored.clips.length!==1||restored.clips[0].bitmap.width!==32||restored.clips[0].seconds!==15||restored.clips[0].motion!=='out'||restored.settings.audioStart!==.5||restored.settings.resolution!=='1080'||restored.settings.transition!=='0.4'||Math.abs(restored.audio.element.duration-1)>.01)throw new Error('復元内容が一致しません');report.textContent='PASS 画像・音声Blobを再読み込み後に復元。順番・秒数・動き・開始位置・解像度・フェード設定が一致。';}catch(e){report.textContent='FAIL '+e.message;}finally{if(restored){disposeImages(restored.clips);disposeAudio(restored.audio);}}};
</script></html>
